[project]
name = "evaluate-training-api"
version = "0.1.0"
description = "API para avaliar treinos de corrida planejados x realizados"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.12",
    "fitdecode>=0.11.0",
    "gpxpy>=1.6.2",
    "alembic>=1.20.1",
    "httpx>=0.28.1",
    "anthropic>=2.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "fit-tool>=0.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
