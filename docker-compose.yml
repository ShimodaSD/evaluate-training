services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-training}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-training}
      POSTGRES_DB: ${POSTGRES_DB:-training}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  api:
    build: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-training}:${POSTGRES_PASSWORD:-training}@db:5432/${POSTGRES_DB:-training}
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api/app:/app/app
      - ./apps/api/migrations:/app/migrations
    # Deixa a API alcançar o Ollama rodando no próprio Mac/PC (fora do Docker).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./apps/web
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web/src:/app/src
    depends_on:
      - api

  # Opcional, para quem não tem o Ollama instalado: docker compose --profile ollama up.
  # No Mac o Docker não usa a GPU, então o Ollama instalado direto no Mac é bem mais rápido.
  ollama:
    image: ollama/ollama:0.12.6
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  db-data:
  ollama-data:
